<body>
    <canvas id="myCanvas"></canvas>
    <div id="panel">
    <div id="verticalButtons">
        <button onclick="save()" title="Save the best brain">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
        </button>
        <button onclick="discard()" title="Discard the saved brain and start over">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414 6.414a2 2 0 001.414.586H19a2 2 0 002-2V7a2 2 0 00-2-2h-8.172a2 2 0 00-1.414.586L3 12z" />
            </svg>
        </button>
        <button id="restoreButton" onclick="restore()" title="Restore the discarded brain">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
        </button>
        <button onclick="nextGeneration()" title="Skip to the next generation">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11.933 12.8a1 1 0 000-1.6L6.6 7.2A1 1 0 005 8v8a1 1 0 001.6.8l5.333-4zM19.933 12.8a1 1 0 000-1.6l-5.333-4A1 1 0 0013 8v8a1 1 0 001.6.8l5.333-4z" />
            </svg>
        </button>
        <button onclick="exportBrain()" title="Export the best brain to a file">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
            </svg>
        </button>
        <button onclick="document.getElementById('importInput').click()" title="Import a brain from a file">
            <svg xmlns="http://www.w3.org/2000/svg" style="height: 12px; width: 12px;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
            </svg>
        </button>
        <input id="importInput" type="file" accept=".json,application/json" onchange="importBrain(this)" hidden>
    </div>
    <div id="stats">
        <div>Generation <b id="generationStat"></b></div>
        <div>Alive <b id="aliveStat"></b></div>
        <div>Distance <b id="distanceStat"></b></div>
        <div>Record <b id="recordStat"></b></div>
        <div>Saved <b id="savedStat"></b></div>
        <div>Mutation <b id="mutationStat"></b></div>
        <input id="mutationInput" type="range" min="0.01" max="0.5" step="0.01" oninput="setMutation(this.value)" title="Mutation amount for the next generation">
        <p id="status"></p>
    </div>
    </div>
    <!--Scripts-->
    <canvas id="networkCanvas"></canvas>
    <script src="src/js/visualizer.js"></script>
    <script src="src/js/network.js"></script>
    <script src="src/js/storage.js"></script>
    <script src="src/js/sensor.js"></script>
    <script src="src/js/utils.js"></script>
    <script src="src/js/road.js"></script>
    <script src="src/js/controls.js"></script>
    <script src="src/js/car.js"></script>
    <script src="src/js/traffic.js"></script>
    <script src="src/js/main.js"></script>
</body>
</html>
